<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GharWalaAI - Bills</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body data-page="bills">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i class="fas fa-home"></i><span>GharWalaAI</span></div>
    <ul class="sidebar-menu">
      <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
      <li class="active"><a href="bills.html"><i class="fas fa-file-invoice"></i> Bills</a></li>
      <li><a href="grocery.html"><i class="fas fa-utensils"></i> Grocery</a></li>
      <li><a href="guests.html"><i class="fas fa-users"></i> Guests</a></li>
      <li><a href="recipes.html"><i class="fas fa-robot"></i> AI Recipes</a></li>
      <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
    </ul>
    <div class="sidebar-footer"><div class="ai-status"><i class="fas fa-circle"></i> AI Active</div></div>
  </nav>

  <main class="main-content">
    <header class="top-bar">
      <div class="top-left">
        <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <h1>Bills</h1>
      </div>
      <div class="header-right">
        <span class="date-display" id="currentDate"></span>
      </div>
    </header>

    <section class="page-section">
      <div class="form-card">
        <h3><i class="fas fa-plus-circle"></i> Add New Bill</h3>
        <form id="billForm">
          <div class="form-row">
            <div class="form-group"><label>Bill Name</label><input type="text" id="billName" required /></div>
            <div class="form-group"><label>Amount (PKR)</label><input type="number" id="billAmount" required /></div>
            <div class="form-group"><label>Due Date</label><input type="date" id="billDueDate" required /></div>
            <div class="form-group"><button class="btn-primary" type="submit"><i class="fas fa-save"></i> Add Bill</button></div>
          </div>
        </form>
      </div>
    </section>

    <section class="page-section">
      <div class="table-card">
        <div class="table-header">
          <h3><i class="fas fa-list"></i> Your Bills</h3>
          <div class="table-actions">
            <span id="totalBills">Total: 0</span>
            <button onclick="checkBillReminders()" class="btn-remind"><i class="fas fa-bell"></i> Check Reminders</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Amount</th><th>Due Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="billsTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="page-section">
      <div class="card" style="padding:20px;">
        <h3>AI Budget Suggestion</h3>
        <p id="budgetSuggestion">Click analyze to get recommendations based on your bills.</p>
        <button class="btn-ai" onclick="analyzeBudget()"><i class="fas fa-brain"></i> Analyze Budget</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
