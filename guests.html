<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>GharWalaAI - Guests</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-home"></i>
            <span>GharWalaAI</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="bills.html"><i class="fas fa-file-invoice"></i> Bills</a></li>
            <li><a href="grocery.html"><i class="fas fa-utensils"></i> Grocery</a></li>
            <li class="active"><a href="guests.html"><i class="fas fa-users"></i> Guests</a></li>
            <li><a href="recipes.html"><i class="fas fa-robot"></i> AI Recipes</a></li>
            <li><a href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="ai-status">
                <i class="fas fa-circle"></i> AI Active
            </div>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="top-left">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <i class="fas fa-bars"></i>
                </button>
                <h1>👥 Guest Management</h1>
            </div>
            <div class="header-right">
                <span class="date-display" id="currentDate"></span>
            </div>
        </header>

        <section class="form-section slide-up">
            <div class="form-card">
                <h3><i class="fas fa-user-plus"></i> Add Guest</h3>
                <form id="guestForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label><i class="fas fa-user"></i> Guest Name</label>
                            <input type="text" id="guestName" placeholder="e.g. Ali Ahmed" required />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-calendar-alt"></i> Arrival Date</label>
                            <input type="date" id="guestArrival" required />
                        </div>
                        <div class="form-group">
                            <label><i class="fas fa-clock"></i> Number of Days</label>
                            <input type="number" id="guestDays" placeholder="e.g. 2" required />
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn-primary">
                                <i class="fas fa-save"></i> Add Guest
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <section class="table-section slide-up" style="animation-delay:0.1s;">
            <div class="table-header">
                <h3><i class="fas fa-list"></i> Upcoming Guests</h3>
                <div class="table-actions">
                    <span id="totalGuests">Total: 0</span>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Guest Name</th>
                            <th>Arrival</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="guestsTableBody">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </section>

        <section class="ai-guests slide-up" style="animation-delay:0.2s;">
            <div class="ai-card">
                <i class="fas fa-robot"></i>
                <div>
                    <h4>🤖 AI Guest Preparation</h4>
                    <p id="guestPrepTip">Click "Get Tips" for AI suggestions on guest preparation.</p>
                    <button onclick="getGuestPrepTips()" class="btn-ai">
                        <i class="fas fa-lightbulb"></i> Get Tips
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadGuests();
            updateDate();
        });
    </script>
</body>
</html>
